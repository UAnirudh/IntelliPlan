<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Study time — IntelliPlan</title>
  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --accent: #3b82f6; --border: #e2e8f0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1120; --card: #111827; --text: #e5e7eb; --muted: #94a3b8; --accent: #60a5fa; --border: #1f2937; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border);
            border-radius: 18px; padding: 28px 24px; text-align: center; }
    .kicker { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    h1 { font-size: 1.35rem; margin: 8px 0 4px; line-height: 1.3; overflow-wrap: anywhere; }
    .course { font-size: 0.9rem; color: var(--muted); min-height: 1.2em; }
    .time { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 18px 0 2px; }
    .time-label { font-size: 0.8rem; color: var(--muted); }
    .site { font-size: 0.82rem; color: var(--muted); margin-top: 16px; overflow-wrap: anywhere; }
    .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
    button, a.btn { font: inherit; font-size: 0.92rem; font-weight: 600; padding: 11px 14px; border-radius: 12px;
                    cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text); text-decoration: none; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button[disabled] { opacity: 0.55; cursor: default; }
    .status { font-size: 0.82rem; color: var(--muted); min-height: 1.2em; margin-top: 12px; }
    .privacy { font-size: 0.72rem; color: var(--muted); margin-top: 18px; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="card">
    <div class="kicker" id="kicker">Study block in progress</div>
    <h1 id="title">Back to it</h1>
    <div class="course" id="course"></div>
    <div class="time" id="timeLeft" aria-live="off">--:--</div>
    <div class="time-label">left in this block</div>
    <div class="site" id="site"></div>
    <div class="actions">
      <button type="button" class="primary" id="breakBtn">Take a 5-minute break</button>
      <button type="button" id="doneBtn">I'm done early</button>
      <a class="btn" id="openApp" href="https://intelliplan.tech/active" target="_blank" rel="noopener">Open IntelliPlan</a>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="privacy">IntelliPlan never records or reports the sites you visit. This page only knows your study plan.</div>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
