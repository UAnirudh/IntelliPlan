name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ── Pre-deploy guard: catch import-time bugs before they reach Railway.
      # The duplicate-route outage on 2026-06-09 (two `def uk_landing` blocks
      # both decorated with @app.route("/uk")) would have been caught here in
      # ~10s instead of crash-looping gunicorn in production. SECRET_KEY and
      # DATABASE_URL are safe ephemeral CI values; the app's db.create_all()
      # runs cleanly against in-memory SQLite at import time.
      - name: Install app dependencies
        # pytest explicitly: the unit-test step below runs before the
        # Playwright install that used to be the only thing pulling it in.
        run: pip install -r requirements.txt pytest
      - name: Import smoke test (catches dup routes, syntax errors, missing imports)
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-smoke-test-key"
        run: |
          python -c "import App; import sys; n = len(list(App.app.url_map.iter_rules())); print(f'OK: {n} routes registered'); sys.exit(0 if n > 0 else 1)"

      # ── The unit suite. This ran nowhere until now: the only pytest
      # invocation in this workflow was the Playwright file at the bottom,
      # which drives *live* intelliplan.tech and so tests whatever is
      # currently deployed rather than the diff under review. Every test
      # under tests/ — around 1500 of them, including the guard that stops
      # account deletion silently missing a table — was invisible to CI, so
      # a PR could go green while breaking any of them.
      #
      # Placed before the Playwright steps deliberately: it is the fast,
      # hermetic one, and a failure here should not wait on a browser
      # download and a deploy poll to be reported.
      #
      # Bare `pytest`, not `pytest tests/`: pytest.ini's testpaths names the
      # hermetic suites, which is tests/ plus test_streak_engine.py and
      # test_streak_e2e.py. Those two predate tests/ and live at the root, so
      # naming a directory here quietly left 25 tests running in no job at
      # all. It still excludes test_intelliplan.py, which the step at the
      # bottom runs on purpose against the live site.
      - name: Unit tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-unit-test-key"
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Camera selection and cancellation regressions
        run: node --test tests/browser/*.test.cjs

      # ── Playwright deps
      - run: pip install playwright pytest-playwright
      - run: playwright install chromium

      - name: Hypothetical assignments in Grade Modeler
        run: python scripts/verify_hypothetical_assignments_browser.py

      - name: Parent and teacher progress workflows
        run: |
          python scripts/verify_adult_access_browser.py
          python scripts/verify_teacher_terms_browser.py
          python scripts/verify_signup_workspace_browser.py
          python scripts/verify_ai_connection_browser.py

      - name: Tutor SVG, quiz and untrusted-content workflows
        env:
          TUTOR_BROWSER_OUTPUT: ${{ runner.temp }}/tutor-browser-proof
        run: |
          python scripts/verify_tutor_exercises_browser.py
          python scripts/verify_tutor_page_browser.py
          python scripts/verify_chemical_rendering_browser.py
          python scripts/verify_tutor_runtime_browser.py
      - name: Premium study, response rendering and quiz persistence workflows
        env:
          PREMIUM_BROWSER_OUTPUT: ${{ runner.temp }}/tutor-browser-proof/premium-workspace
        run: python scripts/verify_premium_workspace_browser.py
      - name: Calendar outage warning and stale-response workflows
        env:
          CALENDAR_BROWSER_OUTPUT: ${{ runner.temp }}/tutor-browser-proof/calendar-health
        run: python scripts/verify_calendar_outage_browser.py
      - name: Scheduler calendar planning and export workflows
        env:
          SCHEDULER_CALENDAR_BROWSER_OUTPUT: ${{ runner.temp }}/tutor-browser-proof/scheduler-calendar
        run: python scripts/verify_scheduler_calendar_browser.py
      - name: Photo notes to interactive practice and saved review
        env:
          PHOTO_STUDY_BROWSER_OUTPUT: ${{ runner.temp }}/tutor-browser-proof/photo-practice
        run: python tests/browser/photo_study_acceptance.py
      - name: Offline account isolation and durable queue workflows
        run: python scripts/verify_offline_owner_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutor-browser-proof
          path: ${{ runner.temp }}/tutor-browser-proof
          if-no-files-found: ignore

      - name: Rendered study camera workflows
        env:
          STUDY_CAMERA_OUTPUT: ${{ runner.temp }}/study-camera-proof
        run: python scripts/verify_study_camera_browser.py
      - name: Direct phone camera WebRTC workflow
        env:
          PHONE_CAMERA_OUTPUT: ${{ runner.temp }}/study-camera-proof/paired-phone
        run: python scripts/verify_phone_camera_browser.py
      - name: Install pinned local camera gateway and synthetic publisher
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p "$RUNNER_TEMP/camera-gateway"
          curl --fail --silent --show-error --location https://github.com/bluenviron/mediamtx/releases/download/v1.21.2/mediamtx_v1.21.2_linux_amd64.tar.gz -o "$RUNNER_TEMP/camera-gateway/release.tar.gz"
          echo "121be6e00397e473a95d83c75f4fcd3819a6af3b0e1a50889cba43ab4fab6a27  $RUNNER_TEMP/camera-gateway/release.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/camera-gateway/release.tar.gz" -C "$RUNNER_TEMP/camera-gateway"
      - name: Real RTSP to HTTPS WHEP camera workflow
        env:
          MEDIA_MTX_BINARY: ${{ runner.temp }}/camera-gateway/mediamtx
          NETWORK_CAMERA_OUTPUT: ${{ runner.temp }}/network-camera-proof
        run: |
          python scripts/verify_network_camera_browser.py
          NETWORK_CAMERA_VIEW=phone NETWORK_CAMERA_OUTPUT="$NETWORK_CAMERA_OUTPUT/phone" python scripts/verify_network_camera_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-camera-browser-proof
          path: |
            ${{ runner.temp }}/network-camera-proof/**/*.png
            ${{ runner.temp }}/network-camera-proof/**/result.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-camera-browser-proof
          path: ${{ runner.temp }}/study-camera-proof
          if-no-files-found: ignore

      # ── Deploy-wait guard: Railway takes 1-3 minutes to roll out a push.
      # The Playwright suite hits LIVE intelliplan.tech, so without this
      # wait the tests race the deploy and see 502s on the very URLs that
      # are about to be served fine. Polls /health for this exact commit and
      # successful schema startup every 10s for up to ~7 minutes. Only runs on push to
      # main, since PRs don't trigger a Railway deploy.
      - name: Wait for production to be healthy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/wait_for_deployment.py --revision "$GITHUB_SHA"

      - run: pytest test_intelliplan.py -v
