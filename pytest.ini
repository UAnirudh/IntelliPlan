[pytest]
# What a bare `pytest` runs: everything hermetic, nothing that needs the
# internet.
#
# tests/ is the main suite. test_streak_engine.py and test_streak_e2e.py
# predate it and still live at the root; naming them here is what puts them
# back in a default run, since the CI job invokes `pytest tests/` and so had
# stopped exercising either of them.
#
# test_intelliplan.py is deliberately absent. It drives the *live* production
# site through Playwright, so it reports on whatever is currently deployed
# rather than on the working tree, and it needs a browser download to run at
# all. Run it on purpose -- `pytest test_intelliplan.py` -- which is what the
# CI job does, after installing Chromium.
testpaths = tests test_streak_engine.py test_streak_e2e.py
