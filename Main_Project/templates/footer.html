<footer style="
  margin-top: auto;
  padding: 1.75rem 2rem;
  border-top: 1px solid var(--footer-border);
  background: var(--footer-bg);
  color: var(--footer-text);
">
  <div style="max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:22px; height:22px; background:#0d0d0d; border-radius:6px; overflow:hidden; flex-shrink:0;">
        <img src="/static/icons/icon-192.png" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <span style="font-family:var(--font-ui); font-size:0.82rem; font-weight:700; color:var(--footer-text); letter-spacing:-0.01em;">IntelliPlan</span>
      <span style="font-size:0.75rem; color:var(--footer-text); opacity:0.45; margin-left:2px;">© 2026</span>
    </div>
    <div style="display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap;">
      <a href="/legal" style="font-family:var(--font-ui); font-size:0.78rem; color:var(--footer-text); text-decoration:none; font-weight:500; opacity:0.7; transition:opacity 0.14s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'">Privacy &amp; Terms</a>
      <a href="/about" style="font-family:var(--font-ui); font-size:0.78rem; color:var(--footer-text); text-decoration:none; font-weight:500; opacity:0.7; transition:opacity 0.14s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'">About</a>
      <a href="/faq" style="font-family:var(--font-ui); font-size:0.78rem; color:var(--footer-text); text-decoration:none; font-weight:500; opacity:0.7; transition:opacity 0.14s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'">FAQ</a>
      <a href="/pricing" style="font-family:var(--font-ui); font-size:0.78rem; color:var(--footer-text); text-decoration:none; font-weight:500; opacity:0.7; transition:opacity 0.14s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'">Pricing</a>
      {% if logged_in %}
      <a href="/dashboard" style="font-family:var(--font-ui); font-size:0.78rem; color:var(--footer-text); text-decoration:none; font-weight:500; opacity:0.7; transition:opacity 0.14s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'">Dashboard</a>
      {% endif %}
    </div>
  </div>

  {# ── Partner badge: Dang.ai (dofollow backlink, indexable) ── #}
  <div style="max-width:1180px; margin:1.1rem auto 0; padding-top:1rem; border-top:1px solid var(--footer-border); display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
    <span style="font-family:var(--font-ui); font-size:0.72rem; color:var(--footer-text); opacity:0.6;">Featured on</span>
    <a href="https://dang.ai/" target="_blank" rel="noopener" title="IntelliPlan on Dang.ai">
      <img src="https://cdn.prod.website-files.com/63d8afd87da01fb58ea3fbcb/6487e2868c6c8f93b4828827_dang-badge.png" alt="Dang.ai" width="150" height="54" loading="lazy" style="width:150px; height:54px; display:block;"/>
    </a>
  </div>
</footer>
