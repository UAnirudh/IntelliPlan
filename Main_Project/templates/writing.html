{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div class="page-kicker">Tools</div>
  <h1 class="page-title">Writing Assistant</h1>
  <p class="page-subtitle">Paste an essay, paragraph, or email, get targeted improvements with reasoning.</p>
</div>

<style>
.writing-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; }
@media (max-width:900px){ .writing-grid{grid-template-columns:1fr;} }
.writing-card {
  background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--r-lg);
  padding:1.25rem; box-shadow:var(--neu-shadow-sm);
}
.writing-card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; flex-wrap:wrap; }
.writing-card-label { font-family:var(--font-ui); font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted); }
.writing-selects { display:flex; gap:6px; }
.writing-select {
  padding:6px 10px; font-size:0.84rem; border-radius:var(--r-sm); border:1px solid var(--border);
  background:var(--bg-card); color:var(--text-primary); cursor:pointer; min-height:34px;
  transition:border-color 0.15s ease;
}
.writing-select:hover { border-color:var(--border-strong); }
.writing-textarea {
  width:100%; min-height:280px; padding:14px; border:1.5px solid var(--border-strong); border-radius:var(--r-md);
  background:var(--bg); color:var(--text-primary); font-family:var(--font-body); font-size:0.92rem;
  resize:vertical; line-height:1.6; transition:border-color 0.15s ease, box-shadow 0.15s ease;
}
.writing-textarea::placeholder { color:var(--text-muted); }
.writing-textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.writing-footer { display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:8px; flex-wrap:wrap; }
.writing-count { font-size:0.75rem; color:var(--text-muted); font-variant-numeric:tabular-nums; }
.writing-submit {
  padding:10px 22px; border:none; cursor:pointer; min-height:44px; border-radius:var(--r-md);
  font-family:var(--font-body); font-weight:600; font-size:0.92rem; background:var(--accent); color:#fff;
  transition:opacity 0.15s ease, transform 0.15s ease;
}
.writing-submit:hover:not(:disabled) { opacity:0.9; }
.writing-submit:active:not(:disabled) { transform:scale(0.98); }
.writing-submit:disabled { opacity:0.55; cursor:not-allowed; }
.writing-tab-btn {
  font-size:0.75rem; border:1px solid var(--border); background:transparent; padding:5px 12px;
  border-radius:var(--r-full); cursor:pointer; color:var(--text-secondary); min-height:32px;
  font-family:var(--font-body); font-weight:500; transition:all 0.15s ease;
}
.writing-tab-btn:hover { border-color:var(--border-strong); color:var(--text-primary); background:var(--bg-elevated); }

.ipd-empty-solution { color:var(--text-muted); font-size:0.9rem; text-align:center; padding:2.5rem 0; line-height:1.6; }
.ipd-error-box {
  background:var(--high-bg); border:1px solid color-mix(in srgb, var(--high) 30%, var(--border));
  border-radius:var(--r-md); padding:12px 14px; font-size:0.86rem; color:var(--high); line-height:1.5;
}
.ipd-error-box button {
  margin-top:8px; padding:6px 14px; border-radius:var(--r-sm); border:1px solid currentColor;
  background:transparent; color:inherit; font-family:var(--font-body); font-size:0.8rem; font-weight:600;
  cursor:pointer; min-height:32px;
}
.ipd-error-box button:hover { background:var(--high); color:#fff; }
.writing-skeleton { display:flex; flex-direction:column; gap:10px; }
.writing-skel-row { height:64px; border-radius:var(--r-md); background:linear-gradient(90deg, var(--border) 25%, transparent 37%, var(--border) 63%); background-size:400% 100%; animation:ipd-pulse 1.5s ease infinite; }

.suggestion { padding:12px 14px; border-radius:var(--r-md); background:var(--bg-elevated); border:1px solid var(--border); margin-bottom:10px; }
.suggestion .cat { font-family:var(--font-ui); font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; padding:3px 10px; border-radius:var(--r-full); display:inline-block; margin-bottom:8px; background:var(--accent-soft); color:var(--accent); }
.cat.grammar { background:var(--high-bg); color:var(--high); }
.suggestion .ex { font-style:italic; color:var(--text-secondary); margin-bottom:6px; font-size:0.86rem; border-left:3px solid var(--border-strong); padding-left:10px; }
.suggestion .fix { font-weight:600; color:var(--text-primary); margin-bottom:6px; font-size:0.92rem; }
.suggestion .why { color:var(--text-muted); font-size:0.82rem; line-height:1.5; }
.score-bubble { display:flex; align-items:center; gap:12px; margin-bottom:1rem; }
.score-num { font-family:var(--font-display); font-size:2.4rem; color:var(--accent); line-height:1; font-variant-numeric:tabular-nums; }
.score-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted); }
.revised-box { background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--r-md); padding:14px; font-size:0.92rem; line-height:1.6; white-space:pre-wrap; max-height:340px; overflow:auto; }
</style>

<div class="writing-grid">
  <div class="writing-card ipd-anim ipd-d1">
    <div class="writing-card-head">
      <label class="writing-card-label" for="wText">Your draft</label>
      <div class="writing-selects">
        <select id="wPurpose" class="writing-select" aria-label="Writing purpose">
          <option value="essay">Essay</option>
          <option value="paragraph">Paragraph</option>
          <option value="email">Email</option>
          <option value="message">Message</option>
          <option value="application">Application</option>
        </select>
        <select id="wTone" class="writing-select" aria-label="Target tone">
          <option value="neutral">Neutral</option>
          <option value="formal">Formal</option>
          <option value="friendly">Friendly</option>
          <option value="persuasive">Persuasive</option>
          <option value="analytical">Analytical</option>
        </select>
      </div>
    </div>
    <textarea id="wText" class="writing-textarea" placeholder="Paste your writing here…" aria-label="Your draft text"></textarea>
    <div class="writing-footer">
      <span id="wCount" class="writing-count">0 words</span>
      <button class="writing-submit" onclick="ipWriteAnalyze()" id="wBtn" type="button">Analyze writing</button>
    </div>
  </div>

  <div class="writing-card ipd-anim ipd-d2">
    <div class="writing-card-head" style="margin-bottom:12px;">
      <div class="writing-card-label">Feedback</div>
      <button id="wRevTab" onclick="ipWriteSwitchTab('rev')" class="writing-tab-btn" type="button">View revised draft</button>
    </div>
    <div id="wResult">
      <div class="ipd-empty-solution">Click <strong>Analyze writing</strong> to see feedback.</div>
    </div>
  </div>
</div>

<script>
const ipWriteText = document.getElementById('wText');
const ipWriteCount = document.getElementById('wCount');
let ipWriteLast = null;
let ipWriteView = 'feedback';

ipWriteText.addEventListener('input', () => {
  const words = ipWriteText.value.trim().split(/\s+/).filter(Boolean).length;
  ipWriteCount.textContent = words + ' word' + (words === 1 ? '' : 's');
});

function ipWriteSwitchTab(view) {
  ipWriteView = view === 'rev' ? 'rev' : 'feedback';
  document.getElementById('wRevTab').textContent = ipWriteView === 'rev' ? 'View suggestions' : 'View revised draft';
  if (ipWriteLast) ipWriteRender();
}

function ipWriteSkeleton() {
  return '<div class="writing-skeleton" role="status" aria-label="Analyzing draft">' +
    '<div class="writing-skel-row" style="height:44px;"></div><div class="writing-skel-row"></div><div class="writing-skel-row"></div>' +
    '</div>';
}

function ipWriteAnalyze() {
  const text = ipWriteText.value.trim();
  if (!text) return;
  const btn = document.getElementById('wBtn');
  btn.disabled = true;
  btn.textContent = 'Analyzing…';
  document.getElementById('wResult').innerHTML = ipWriteSkeleton();
  fetch('/api/writing/analyze', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      text,
      tone: document.getElementById('wTone').value,
      purpose: document.getElementById('wPurpose').value,
    }),
  }).then(r => r.json()).then(d => {
    btn.disabled = false;
    btn.textContent = 'Analyze writing';
    if (d.status !== 'ok') {
      document.getElementById('wResult').innerHTML = '<div class="ipd-error-box">Couldn’t analyze your draft. ' + ipWriteEsc(d.message || 'Try again in a moment.') + '<br><button onclick="ipWriteAnalyze()" type="button">Retry</button></div>';
      return;
    }
    ipWriteLast = d;
    ipWriteView = 'feedback';
    document.getElementById('wRevTab').textContent = 'View revised draft';
    ipWriteRender();
  }).catch(() => {
    btn.disabled = false;
    btn.textContent = 'Analyze writing';
    document.getElementById('wResult').innerHTML = '<div class="ipd-error-box">Couldn’t reach the server. Check your connection and try again.<br><button onclick="ipWriteAnalyze()" type="button">Retry</button></div>';
  });
}

function ipWriteEsc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function ipWriteRender() {
  const d = ipWriteLast;
  if (!d) return;
  const out = document.getElementById('wResult');
  if (ipWriteView === 'rev') {
    out.innerHTML = '<div class="revised-box">' + ipWriteEsc(d.revised || 'No revised draft was returned.') + '</div>';
    return;
  }
  const overall = d.overall || {};
  const suggestions = d.suggestions || [];
  const score = overall.score != null ? overall.score : '–';
  let html = `
    <div class="score-bubble">
      <div class="score-num">${ipWriteEsc(score)}</div>
      <div>
        <div class="score-label">Overall score</div>
        <div style="font-size:0.9rem;color:var(--text-secondary);max-width:280px;">${ipWriteEsc(overall.summary || '')}</div>
      </div>
    </div>`;
  if (!suggestions.length) {
    html += '<div class="ipd-empty-solution" style="padding:1rem 0;">No suggestions — this draft reads clean.</div>';
  } else {
    html += suggestions.map(s => `
      <div class="suggestion">
        <span class="cat ${ipWriteEsc(s.category||'')}">${ipWriteEsc(s.category||'note')}</span>
        ${s.excerpt ? `<div class="ex">"${ipWriteEsc(s.excerpt)}"</div>` : ''}
        <div class="fix">${ipWriteEsc(s.suggestion||'')}</div>
        <div class="why">${ipWriteEsc(s.why||'')}</div>
      </div>`).join('');
  }
  out.innerHTML = html;
}
</script>
{% endblock %}
