{% extends "base.html" %}

{% block content %}
<style>
  .td-shell { display: flex; flex-direction: column; gap: 1.75rem; }
  .td-toolbar { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
  .td-invite {
    display: flex; gap: 0.5rem; flex: 1; min-width: 280px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--r-md); padding: 0.5rem;
  }
  .td-invite input { flex: 1; border: 0; background: transparent; padding: 0 0.5rem; color: var(--text-primary); outline: none; font-size: 0.9rem; }
  .td-students { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
  .td-student-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--r-lg); padding: 1.1rem 1.25rem;
    transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
    cursor: pointer; display: flex; flex-direction: column; gap: 0.75rem;
  }
  .td-student-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: var(--border-accent); }
  .td-student-card.pending { opacity: 0.7; border-style: dashed; cursor: default; }
  .td-student-name { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; color: var(--text-primary); }
  .td-student-email { font-size: 0.78rem; color: var(--text-muted); margin-top: -4px; }
  .td-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
  .td-stat { text-align: center; padding: 0.4rem 0.2rem; background: var(--bg-elevated); border-radius: var(--r-sm); }
  .td-stat-val { font-family: var(--font-display); font-size: 1.1rem; font-weight:400; color: var(--text-primary); }
  .td-stat-label { font-size: 0.62rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
  .td-detail-pane {
    position: fixed; inset: 0; z-index: 10000;
    background: rgba(0,0,0,0.45); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 2rem;
  }
  .td-detail-pane.open { display: flex; }
  .td-detail-box {
    background: var(--bg-card); border: 1px solid var(--border-strong);
    border-radius: var(--r-xl); padding: 1.75rem; width: min(620px, 100%);
    max-height: 80vh; overflow-y: auto; box-shadow: var(--shadow-lg);
  }
  .td-empty { padding: 3rem 1rem; text-align: center; color: var(--text-muted); }
  .td-pill { display: inline-flex; padding: 2px 10px; border-radius: var(--r-full); background: var(--accent-soft); color: var(--accent); font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
</style>

<div class="page-header">
  <h1 class="page-title">Teacher dashboard</h1>
  <p class="page-subtitle">Read-only view of your linked students' workload, progress, and upcoming deadlines.</p>
</div>

<div class="td-shell">
  <div class="td-toolbar">
    <form class="td-invite" id="tdInviteForm" onsubmit="return tdInvite(event)">
      <input type="email" id="tdInviteEmail" placeholder="Invite a student by email…" required />
      <button type="submit" class="btn-primary">Send invite</button>
    </form>
  </div>

  <div id="tdStudents" class="td-students"></div>
  <div id="tdEmpty" class="td-empty" style="display:none;">
    No linked students yet. Invite one with their email above — they'll see a consent prompt in their account.
  </div>
</div>

<div id="tdDetail" class="td-detail-pane" onclick="if(event.target===this)tdCloseDetail()">
  <div class="td-detail-box" id="tdDetailBox"></div>
</div>

<script>
async function tdLoad() {
  const r = await fetch('/api/roles/links', { credentials: 'same-origin' });
  if (!r.ok) return;
  const data = await r.json();
  const host = document.getElementById('tdStudents');
  host.innerHTML = '';
  if (!data.links || !data.links.length) {
    document.getElementById('tdEmpty').style.display = 'block';
    return;
  }
  document.getElementById('tdEmpty').style.display = 'none';

  for (const link of data.links) {
    const card = document.createElement('div');
    card.className = 'td-student-card' + (link.accepted ? '' : ' pending');
    let inner = `
      <div>
        <div class="td-student-name">${link.student_name}</div>
        <div class="td-student-email">${link.student_email}</div>
      </div>`;
    if (!link.accepted) {
      inner += `<div><span class="td-pill">Awaiting consent</span></div>`;
    } else {
      inner += `<div id="tdStats-${link.student_id}" class="td-stats">
        <div class="td-stat"><div class="td-stat-val">…</div><div class="td-stat-label">Total</div></div>
        <div class="td-stat"><div class="td-stat-val">…</div><div class="td-stat-label">Done</div></div>
        <div class="td-stat"><div class="td-stat-val">…</div><div class="td-stat-label">Avg %</div></div>
      </div>`;
    }
    card.innerHTML = inner;
    if (link.accepted) {
      card.onclick = () => tdOpenDetail(link.student_id, link.student_name);
      tdLoadStats(link.student_id);
    }
    host.appendChild(card);
  }
}

async function tdLoadStats(studentId) {
  try {
    const r = await fetch(`/api/roles/student/${studentId}/overview`, { credentials: 'same-origin' });
    if (!r.ok) return;
    const data = await r.json();
    const s = data.summary || {};
    const host = document.getElementById(`tdStats-${studentId}`);
    if (!host) return;
    host.innerHTML = `
      <div class="td-stat"><div class="td-stat-val">${s.total_assignments ?? 0}</div><div class="td-stat-label">Total</div></div>
      <div class="td-stat"><div class="td-stat-val">${s.completed ?? 0}</div><div class="td-stat-label">Done</div></div>
      <div class="td-stat"><div class="td-stat-val">${s.avg_percent != null ? s.avg_percent + '%' : '—'}</div><div class="td-stat-label">Avg</div></div>`;
  } catch (e) { /* ignore */ }
}

async function tdOpenDetail(studentId, studentName) {
  const r = await fetch(`/api/roles/student/${studentId}/overview`, { credentials: 'same-origin' });
  if (!r.ok) return;
  const data = await r.json();
  const s = data.summary || {};
  const upcoming = (s.upcoming || []).map(u =>
    `<li><strong>${u.title || 'Assignment'}</strong> · ${u.course || '—'} · ${u.due_date || 'no due date'}</li>`
  ).join('') || '<li style="color:var(--text-muted);">Nothing upcoming.</li>';
  document.getElementById('tdDetailBox').innerHTML = `
    <h2 style="font-family:var(--font-display);font-size:1.5rem;margin:0 0 0.25rem;">${studentName}</h2>
    <p style="color:var(--text-muted);margin:0 0 1.25rem;">Read-only snapshot. The student controls what's shared via /linked-accounts.</p>
    <div class="td-stats" style="margin-bottom:1rem;">
      <div class="td-stat"><div class="td-stat-val">${s.total_assignments ?? 0}</div><div class="td-stat-label">Total</div></div>
      <div class="td-stat"><div class="td-stat-val">${s.completed ?? 0}</div><div class="td-stat-label">Done</div></div>
      <div class="td-stat"><div class="td-stat-val">${s.overdue ?? 0}</div><div class="td-stat-label">Overdue</div></div>
      <div class="td-stat"><div class="td-stat-val">${s.avg_percent != null ? s.avg_percent + '%' : '—'}</div><div class="td-stat-label">Avg %</div></div>
    </div>
    <h3 style="font-family:var(--font-display);font-size:1.1rem;margin:1rem 0 0.5rem;">Upcoming</h3>
    <ul style="padding-left:1.1rem;line-height:1.6;font-size:0.92rem;">${upcoming}</ul>
    <div style="margin-top:1.5rem;text-align:right;"><button class="btn-secondary" onclick="tdCloseDetail()">Close</button></div>`;
  document.getElementById('tdDetail').classList.add('open');
}

function tdCloseDetail() { document.getElementById('tdDetail').classList.remove('open'); }

async function tdInvite(e) {
  e.preventDefault();
  const email = document.getElementById('tdInviteEmail').value.trim();
  if (!email) return false;
  const r = await fetch('/api/roles/invite', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ student_email: email }),
  });
  const data = await r.json();
  if (!r.ok) {
    alert(data.error === 'student_not_found'
      ? "We couldn't find a student with that email."
      : 'Could not invite: ' + (data.error || r.status));
    return false;
  }
  document.getElementById('tdInviteEmail').value = '';
  tdLoad();
  return false;
}

tdLoad();
</script>
{% endblock %}
