{% extends "base.html" %}
{% block content %}
<style>
  /* ChatGPT-glass auth card — same recipe as /login and the other siblings. */
  .login-wrap .login-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--r-lg);
    box-shadow: var(--neu-shadow-sm);
    position: relative;
    overflow: hidden;
  }
  .login-wrap .login-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--grad-brand);
  }
  .login-wrap .form-input {
    transition: border-color 0.18s var(--ease-out), box-shadow 0.18s var(--ease-out);
  }
  .login-wrap .form-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    outline: none;
  }
  .login-wrap .btn-primary {
    min-height: 44px;
    transition: transform 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out);
  }
  .login-wrap .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-hover);
  }
  /* Password show/hide */
  .ip-pw-wrap { position: relative; }
  .ip-pw-wrap .form-input { padding-right: 48px; }
  .ip-pw-toggle {
    position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: var(--text-muted); cursor: pointer;
    border-radius: var(--r-sm);
    transition: color 0.15s var(--ease-out), background 0.15s var(--ease-out);
  }
  .ip-pw-toggle:hover { color: var(--text-primary); background: var(--accent-soft); }
  .ip-pw-toggle .ip-eye-off { display: none; }
  .ip-pw-toggle.is-on .ip-eye { display: none; }
  .ip-pw-toggle.is-on .ip-eye-off { display: block; }
  @media (prefers-reduced-motion: reduce) {
    .login-wrap .form-input, .login-wrap .btn-primary, .ip-pw-toggle { transition: none; }
  }
</style>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon" style="width:48px;height:48px;margin:0 auto 1rem;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;">
        <img src="/static/icons/icon-192.png" alt="IntelliPlan" style="width:100%;height:100%;object-fit:cover;">
      </div>
      <h1 class="login-title">Welcome back</h1>
      <p class="login-subtitle">Sign in to your IntelliPlan account</p>
    </div>
    {% if error %}
    <div class="login-error"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><use href="#i-warning"/></svg> {{ error }}</div>
    {% endif %}
    <form class="login-form" method="POST" action="/login/account">
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="email" class="form-input" autocomplete="email" placeholder="you@school.edu" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" class="form-input" autocomplete="current-password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-primary" style="width:100%;padding:14px;border:none;cursor:pointer;font-size:0.95rem;">
        Sign In →
      </button>
    </form>
    <div class="login-footer">
      <p>No account? <a href="/register" class="login-link">Create one free</a></p>
      <p style="margin-top:6px;"><a href="/login" class="login-link">← Back to login options</a></p>
    </div>
  </div>
</div>
{% endblock %}
