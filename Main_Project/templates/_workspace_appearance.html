<dialog id="workspaceAppearance" class="workspace-appearance" aria-labelledby="workspaceAppearanceTitle">
  <header><h2 id="workspaceAppearanceTitle">Make it yours</h2><button type="button" class="no-glass" data-appearance-close aria-label="Close appearance settings">Close</button></header>
  <label for="appearanceDensity">Spacing<select id="appearanceDensity" data-appearance="density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></label>
  <label for="appearanceWidth">Reading width<select id="appearanceWidth" data-appearance="width"><option value="focused">Focused</option><option value="wide">Wide</option></select></label>
  <label for="appearanceText">Reading size<select id="appearanceText" data-appearance="text"><option value="standard">Standard</option><option value="large">Large</option><option value="larger">Extra large</option></select></label>
  <label for="appearanceSurface">Surfaces<select id="appearanceSurface" data-appearance="surface"><option value="glass">Soft glass</option><option value="solid">Solid</option></select></label>
  <label for="appearanceAccent">Accent<select id="appearanceAccent" data-appearance="accent"><option value="default">My theme</option><option value="emerald">Emerald</option><option value="violet">Violet</option></select></label>
  <label for="appearanceMotion">Transitions<select id="appearanceMotion" data-appearance="motion"><option value="full">Fluid</option><option value="reduce">Reduced motion</option></select></label>
  <label for="appearanceMascot">Assistant character<select id="appearanceMascot" data-appearance="mascot"><option value="shown">Show</option><option value="hidden">Hide</option></select></label>
  <p>Saved on this device. Your system accessibility preferences take priority. Tool access is managed separately by your school.</p>
  <button type="button" class="no-glass" id="appearanceReset">Restore defaults</button>
</dialog>
