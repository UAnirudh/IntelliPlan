<details id="ipaCameraMenu" class="ipa-camera-menu">
  <summary>Camera source</summary>
  <label for="ipaCameraSource">Choose your camera</label>
  <select id="ipaCameraSource" aria-describedby="ipaCameraSourceNote">
    <option value="">Default or front camera</option>
    <option value="rear">Back camera, when available</option>
  </select>
  <p class="ipa-focus-note" id="ipaCameraListStatus" role="status"></p>
  <p class="ipa-focus-note" id="ipaCameraSourceNote">
    USB webcams, capture cards and virtual cameras appear after your browser grants access.
    To use a phone or network camera here, connect it as a webcam on this device first.
    Selecting a source keeps the camera off until you enable the check-in.
  </p>
</details>
