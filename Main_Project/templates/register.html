{% extends "base.html" %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon" style="width:48px;height:48px;font-size:24px;margin:0 auto 1rem;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;">
        <img src="/static/icons/icon-192.png" style="width:100%;height:100%;object-fit:cover;">
      </div>
      <h1 class="login-title">Create your account</h1>
      <p class="login-subtitle">Free forever. No credit card needed.</p>
    </div>

    {% if error %}
    <div class="login-error"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><use href="#i-warning"/></svg> {{ error }}</div>
    {% endif %}

    <!-- Google Sign Up (recommended) -->
    <a href="/login/google" style="display:flex;align-items:center;gap:10px;justify-content:center;padding:12px;border-radius:var(--r-md);border:1px solid var(--border-strong);background:#fff;color:#3c4043;font-family:var(--font-ui);font-size:0.87rem;font-weight:600;text-decoration:none;margin-bottom:0.75rem;box-shadow:var(--shadow);transition:all 0.16s;"
      onmouseover="this.style.boxShadow='0 4px 16px rgba(0,0,0,0.12)';this.style.transform='translateY(-1px)'"
      onmouseout="this.style.boxShadow='var(--shadow)';this.style.transform='translateY(0)'">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </a>
    <div style="text-align:center;font-size:0.75rem;color:var(--text-muted);margin-bottom:1rem;">
      ✓ Recommended — no password needed
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:1rem;">
      <div style="flex:1;height:1px;background:var(--border);"></div>
      <span style="font-size:0.78rem;color:var(--text-muted);font-weight:500;">or sign up with email</span>
      <div style="flex:1;height:1px;background:var(--border);"></div>
    </div>

    <form class="login-form" method="POST" action="/register">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-input" placeholder="you@school.edu" required />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="At least 8 characters" required />
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-input" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-primary" style="width:100%;padding:14px;border:none;cursor:pointer;font-size:0.95rem;">
        Create Account →
      </button>
    </form>

    <div class="login-footer">
      <p>Already have an account? <a href="/login/account" class="login-link">Sign in</a></p>
      <p style="margin-top:6px;"><a href="/login" class="login-link">← Back to login options</a></p>
    </div>
  </div>
</div>
{% endblock %}
