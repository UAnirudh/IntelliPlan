{% extends "base.html" %}
{% block content %}
<div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem;">
  <div>
    <div class="page-kicker">Learn</div>
    <h1 class="page-title">Lesson library</h1>
    <p class="page-subtitle">Upload class recordings, IntelliPlan summarises each one for revision.</p>
  </div>
  <button class="btn-primary" onclick="openUpload()" style="padding:10px 22px;border:none;cursor:pointer;">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right:6px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Upload lesson
  </button>
</div>


<style>
.lesson-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1.25rem; }
@media (max-width: 380px) { .lesson-grid { grid-template-columns: 1fr; } }
.lesson-card {
  background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--r-lg);
  padding:0; display:flex; flex-direction:column; overflow:hidden;
  animation:fadeUp 0.3s var(--ease-out) both;
  box-shadow:var(--neu-shadow-sm);
  transition:transform 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out), border-color 0.2s var(--ease-out);
}
.lesson-card:hover { transform:translateY(-1px); box-shadow:var(--neu-shadow); border-color:var(--border-accent); }
.lesson-media { width:100%; aspect-ratio:16/9; background:var(--bg-elevated); display:flex; align-items:center; justify-content:center; }
.lesson-media.is-audio { background:var(--accent-soft); }
.lesson-media video, .lesson-media audio { width:100%; height:100%; object-fit:cover; }
.lesson-body { padding:1rem 1.1rem; display:flex; flex-direction:column; gap:8px; flex:1; }
.lesson-title { font-family:var(--font-display); font-size:1.1rem; font-weight:400; color:var(--text-primary); line-height:1.25; }
.lesson-meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:0.74rem; color:var(--text-muted); }
.lesson-tag { padding:2px 9px; border-radius:var(--r-full); background:var(--accent-soft); color:var(--accent); font-family:var(--font-ui); font-size:0.66rem; font-weight:700; }
.lesson-summary { font-size:0.86rem; color:var(--text-secondary); line-height:1.55; max-height:140px; overflow:auto; white-space:pre-wrap; border-top:1px dashed var(--border); padding-top:8px; }
.lesson-status { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:var(--r-xs); font-family:var(--font-ui); font-size:0.65rem; font-weight: 700; text-transform:uppercase; letter-spacing:0.06em; }
.status-pending { background:var(--medium-bg); color:var(--medium); }
.status-ready { background:var(--low-bg); color:var(--low); }
.status-failed { background:var(--high-bg); color:var(--high); }
.lesson-action-btn {
  font-size:0.72rem; padding:5px 11px; border:1px solid var(--border); background:var(--bg);
  border-radius:var(--r-full); cursor:pointer; color:var(--text-secondary);
  font-family:var(--font-ui); font-weight:600;
  transition:background 0.16s var(--ease-out), border-color 0.16s var(--ease-out), color 0.16s var(--ease-out);
}
.lesson-action-btn:hover { background:var(--accent-soft); border-color:var(--border-accent); color:var(--accent); }
.lesson-action-btn:active { transform:scale(0.98); }
.lesson-delete-btn {
  font-size:0.72rem; padding:5px 11px; border:1px solid var(--high); background:var(--high-bg);
  color:var(--high); border-radius:var(--r-full); cursor:pointer; margin-left:auto;
  font-family:var(--font-ui); font-weight:600;
  transition:background 0.16s var(--ease-out), color 0.16s var(--ease-out);
}
.lesson-delete-btn:hover { background:var(--high); color:var(--bg); }
.lesson-delete-btn:active { transform:scale(0.98); }
.upload-modal { position:fixed; inset:0; z-index:1500; background:var(--scrim); display:none; align-items:center; justify-content:center; padding:1rem; }
.upload-modal.on { display:flex; }
@supports (backdrop-filter: blur(1px)) {
  .upload-modal { backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
}
.upload-card {
  background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--r-xl);
  padding:1.75rem; width:min(540px,100%); box-shadow:var(--shadow-lg); max-height:90vh; overflow:auto;
  animation:fadeUp 0.22s var(--ease-out) both;
}
@supports (backdrop-filter: blur(1px)) {
  .upload-card { backdrop-filter:blur(var(--glass-blur)); -webkit-backdrop-filter:blur(var(--glass-blur)); }
}
.upload-close-btn {
  background:none; border:none; color:var(--text-muted); cursor:pointer;
  padding:4px; border-radius:var(--r-sm); display:inline-flex; min-width:32px; min-height:32px;
  align-items:center; justify-content:center; transition:background 0.14s var(--ease-out);
}
.upload-close-btn:hover { background:var(--bg-elevated); color:var(--text-primary); }
.ipLessonFormError {
  display:none; background:var(--high-bg); color:var(--high); border:1px solid var(--high);
  border-radius:var(--r-sm); padding:9px 13px; font-size:0.82rem; font-weight:500;
}
.ipLessonFormError.on { display:block; }

/* ── Loading skeleton, shape-matched to .lesson-card ── */
.ipLessonSkeleton {
  background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--r-lg);
  overflow:hidden; box-shadow:var(--neu-shadow-sm);
}
.ipLessonSkeleton-media { width:100%; aspect-ratio:16/9; background:var(--bg-elevated); animation:ipd-pulse 1.4s ease-in-out infinite; }
.ipLessonSkeleton-body { padding:1rem 1.1rem; display:flex; flex-direction:column; gap:10px; }
.ipLessonSkeleton-line { height:13px; border-radius:var(--r-xs); background:var(--bg-elevated); animation:ipd-pulse 1.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .ipLessonSkeleton-media, .ipLessonSkeleton-line { animation:none; }
}

/* ── Empty + error states ── */
.ipLessonEmpty { grid-column:1/-1; text-align:center; padding:4rem 1.5rem; color:var(--text-muted); }
.ipLessonEmpty-icon {
  width:52px; height:52px; margin:0 auto 1rem; background:var(--accent-soft);
  border-radius:var(--r-lg); display:flex; align-items:center; justify-content:center; color:var(--accent);
}
.ipLessonEmpty-title { font-family:var(--font-display); font-size:1.2rem; font-weight:400; color:var(--text-secondary); margin-bottom:0.4rem; }
.ipLessonEmpty-sub { font-size:0.88rem; margin-bottom:1.5rem; }
.ipLessonError-retry {
  margin-top:1rem; padding:8px 18px; border-radius:var(--r-md);
  border:1px solid var(--border); background:var(--glass-bg); -webkit-backdrop-filter:blur(16px) saturate(1.6); backdrop-filter:blur(16px) saturate(1.6); color:var(--accent);
  cursor:pointer; font-family:var(--font-ui); font-size:0.82rem; font-weight:600;
  transition:background 0.16s var(--ease-out), border-color 0.16s var(--ease-out);
}
.ipLessonError-retry:hover { background:var(--accent-soft); border-color:var(--border-accent); }
.ipLessonError-retry:active { transform:scale(0.98); }
</style>

<div id="lessonsList" class="lesson-grid" data-ip-boundary></div>
<div id="lessonsFooter"></div>

<!-- Upload modal -->
<div id="upMod" class="upload-modal" onclick="if(event.target===this)closeUpload()">
  <div class="upload-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
      <h2 style="font-family:var(--font-display);font-size:1.25rem;color:var(--text-primary);margin:0;">Upload Lesson</h2>
      <button type="button" onclick="closeUpload()" aria-label="Close dialog" style="background:none;border:none;font-size:1.4rem;color:var(--text-muted);cursor:pointer;">×</button>
    </div>
    <form id="upForm" onsubmit="submitUpload(event)" style="display:flex;flex-direction:column;gap:0.9rem;">
      <div class="form-group">
        <label class="form-label">Title</label>
        <input type="text" name="title" class="form-input" required maxlength="255" placeholder="e.g. AP Bio - Cell Respiration">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.9rem;">
        <div class="form-group">
          <label class="form-label">Course (optional)</label>
          <input type="text" name="course" class="form-input" maxlength="128" placeholder="AP Biology">
        </div>
        <div class="form-group">
          <label class="form-label">Tags (comma-separated)</label>
          <input type="text" name="tags" class="form-input" maxlength="200" placeholder="biology, exam-1">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Audio or video file</label>
        <input type="file" name="file" accept="audio/*,video/*" required class="form-input">
        <span class="form-hint">Up to ~25 MB. Supports mp3, m4a, wav, mp4, webm, mov.</span>
      </div>
      <div class="form-group">
        <label class="form-label">Transcript (optional, paste for better summary)</label>
        <textarea name="transcript" rows="5" class="form-input" placeholder="Paste a transcript if you have one, the summary will use it for accurate notes."></textarea>
      </div>
      <button type="submit" class="btn-primary" id="upBtn" style="padding:12px;border:none;cursor:pointer;">Upload & summarise</button>
    </form>
  </div>
</div>

<script>
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function openUpload() { document.getElementById('upMod').classList.add('on'); }
function closeUpload() { document.getElementById('upMod').classList.remove('on'); }

function statusClass(s) { return s === 'ready' ? 'status-ready' : s === 'failed' ? 'status-failed' : 'status-pending'; }

/* One card. Returned as a node rather than an HTML string so the paginator
   can append pages without re-parsing and re-mounting the <video> elements
   already on screen — reflowing those restarts playback. */
function lessonCard(l) {
  const card = document.createElement('div');
  card.className = 'lesson-card';
  card.dataset.lessonId = l.id;
  const tagsHtml = (l.tags || []).map(t => `<span class="lesson-tag">${esc(t)}</span>`).join('');
  const media = l.media_kind === 'audio'
    ? `<div class="lesson-media is-audio"><audio controls src="${esc(l.stream_url)}" preload="metadata" style="width:90%;"></audio></div>`
    : `<div class="lesson-media"><video controls src="${esc(l.stream_url)}" preload="metadata"></video></div>`;
  card.innerHTML = `
    ${media}
    <div class="lesson-body">
      <div class="lesson-title">${esc(l.title)}</div>
      <div class="lesson-meta">
        <span class="lesson-status ${statusClass(l.summary_status)}">${esc(l.summary_status)}</span>
        ${l.course ? `<span>· ${esc(l.course)}</span>` : ''}
        ${tagsHtml}
      </div>
      <div class="lesson-summary">${(l.summary || '').trim() ? esc(l.summary) : '<em style="color:var(--text-muted);">Summary is still generating. Refresh it in a moment.</em>'}</div>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <button type="button" class="lesson-action-btn" onclick="resumm(${l.id})">Refresh summary</button>
        <button type="button" class="lesson-delete-btn" onclick="delLesson(${l.id})">Delete</button>
      </div>
    </div>`;
  return card;
}

let lessonsPager = null;

/* Paged, because /api/lessons used to hand back every lesson a user had
   ever uploaded — transcripts included — on each page load. */
function loadLessons() {
  if (lessonsPager) return lessonsPager.reset();
  lessonsPager = IP.paginate({
    list: '#lessonsList',
    footerHost: '#lessonsFooter',
    mode: 'infinite',
    skeleton: 'cards',
    pageSize: 6,
    unit: 'lesson',
    errorTitle: 'Your lessons did not load',
    fetchPage: page => IP.get('/api/lessons?per_page=12&page=' + page),
    renderItem: lessonCard,
    empty: {
      title: 'No lessons yet',
      body: 'Upload a recording and IntelliPlan writes the summary for you.',
      action: { label: 'Upload a lesson', onClick: openUpload }
    }
  });
  return lessonsPager;
}

function submitUpload(e) {
  e.preventDefault();
  const form = document.getElementById('upForm');
  const data = new FormData(form);
  const btn = document.getElementById('upBtn');
  btn.disabled = true; btn.textContent = 'Uploading...';
  IP.request('/api/lessons', { method: 'POST', body: data, timeout: 120000 })
    .then(() => {
      form.reset();
      closeUpload();
      IP.toast('Lesson uploaded. The summary is generating now.', 'success');
      loadLessons();
    })
    .catch(err => IP.toast(err.friendly ? err.friendly() : 'Upload failed.', 'error'))
    .then(() => { btn.disabled = false; btn.textContent = 'Upload & summarise'; });
}

function resumm(id) {
  IP.post('/api/lessons/' + id + '/resummarize', {})
    .then(() => { IP.toast('Rewriting the summary. This takes a few seconds.', 'info'); loadLessons(); })
    .catch(err => IP.toast(err.friendly ? err.friendly() : 'Could not refresh that summary.', 'error'));
}

/* Deleting a recording cannot be undone, so it still asks first — but the
   card leaves immediately and comes back if the server refuses. */
function delLesson(id) {
  if (!confirm('Delete this lesson and its recording? This cannot be undone.')) return;
  const card = document.querySelector(`.lesson-card[data-lesson-id="${id}"]`);
  if (!card) return;
  const parent = card.parentNode, next = card.nextSibling;

  IP.optimistic({
    label: 'deletion',
    apply:    () => card.remove(),
    rollback: () => parent.insertBefore(card, next),
    commit:   () => IP.request('/api/lessons/' + id, { method: 'DELETE' }),
    onSuccess: () => IP.toast('Lesson deleted.', 'success')
  }).catch(() => {});
}

loadLessons();
</script>
{% endblock %}
