{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div class="page-kicker">Tools</div>
  <h1 class="page-title">Math Explainer</h1>
  <p class="page-subtitle">Drop in a math problem and get step-by-step reasoning.</p>
</div>

<style>
.math-grid { display:grid; grid-template-columns:1fr 1.2fr; gap:1.25rem; }
@media (max-width:900px){ .math-grid{grid-template-columns:1fr;} }
.math-card {
  background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--r-lg);
  padding:1.25rem; box-shadow:var(--neu-shadow-sm);
}
.math-card-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
.math-card-label {
  font-family:var(--font-ui); font-size:0.78rem; font-weight:700; text-transform:uppercase;
  letter-spacing:0.06em; color:var(--text-muted);
}
.math-level-select {
  padding:6px 10px; font-size:0.84rem; border-radius:var(--r-sm); border:1px solid var(--border);
  background:var(--glass-input-bg); -webkit-backdrop-filter:blur(8px) saturate(1.3); backdrop-filter:blur(8px) saturate(1.3); color:var(--text-primary); cursor:pointer; min-height:34px;
  transition:border-color 0.15s ease, box-shadow 0.15s ease;
}
.math-level-select:hover { border-color:var(--border-strong); }
.math-textarea {
  width:100%; min-height:200px; padding:14px; border:1.5px solid var(--border-strong); border-radius:var(--r-md);
  background:var(--bg); color:var(--text-primary); font-family:var(--font-mono); font-size:0.92rem;
  resize:vertical; line-height:1.55; transition:border-color 0.15s ease, box-shadow 0.15s ease;
}
.math-textarea::placeholder { color:var(--text-muted); }
.math-textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.math-submit {
  margin-top:12px; padding:10px 22px; border:none; cursor:pointer; width:100%; min-height:44px;
  border-radius:var(--r-md); font-family:var(--font-body); font-weight:600; font-size:0.92rem;
  background:var(--accent); color:#fff; transition:opacity 0.15s ease, transform 0.15s ease;
}
.math-submit:hover:not(:disabled) { opacity:0.9; }
.math-submit:active:not(:disabled) { transform:scale(0.98); }
.math-submit:disabled { opacity:0.55; cursor:not-allowed; }
.math-submit .ipd-pulse-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:currentColor; margin-right:6px; animation:ipd-pulse 1s ease infinite; vertical-align:middle; }

.ipd-empty-solution { color:var(--text-muted); font-size:0.9rem; text-align:center; padding:2.5rem 0; line-height:1.6; }
.ipd-error-box {
  background:var(--high-bg); border:1px solid color-mix(in srgb, var(--high) 30%, var(--border));
  border-radius:var(--r-md); padding:12px 14px; font-size:0.86rem; color:var(--high); line-height:1.5;
}
.ipd-error-box button {
  margin-top:8px; padding:6px 14px; border-radius:var(--r-sm); border:1px solid currentColor;
  background:transparent; color:inherit; font-family:var(--font-body); font-size:0.8rem; font-weight:600;
  cursor:pointer; min-height:32px;
}
.ipd-error-box button:hover { background:var(--high); color:#fff; }

.math-skeleton { display:flex; flex-direction:column; gap:10px; }
.math-skel-row { height:56px; border-radius:var(--r-md); background:linear-gradient(90deg, var(--border) 25%, transparent 37%, var(--border) 63%); background-size:400% 100%; animation:ipd-pulse 1.5s ease infinite; }
.math-skel-row.short { height:70px; }

.step-row { display:flex; gap:12px; padding:12px 14px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--r-md); margin-bottom:10px; }
.step-num { width:28px; height:28px; flex-shrink:0; border-radius:50%; background:var(--accent); color:#fff; font-family:var(--font-ui); font-weight:700; font-size:0.84rem; display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums; }
.step-body { flex:1; min-width:0; }
.step-text { font-size:0.9rem; color:var(--text-primary); margin-bottom:6px; line-height:1.5; }
.step-math { font-family:var(--font-mono); font-size:0.95rem; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:var(--text-primary); white-space:pre-wrap; overflow-x:auto; }
.answer-card { background:var(--low-bg); border:1.5px solid color-mix(in srgb, var(--low) 35%, var(--border)); border-radius:var(--r-md); padding:1rem 1.2rem; margin-top:1rem; }
.answer-label { font-family:var(--font-ui); font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--low); margin-bottom:4px; }
.answer-value { font-family:var(--font-mono); font-size:1.15rem; font-weight:700; color:var(--text-primary); word-break:break-word; font-variant-numeric:tabular-nums; }
.notes-box { background:var(--medium-bg); border:1px solid color-mix(in srgb, var(--medium) 35%, var(--border)); border-radius:var(--r-sm); padding:10px 12px; margin-top:0.8rem; font-size:0.84rem; color:var(--text-secondary); line-height:1.5; }
.similar-card { background:var(--bg-elevated); border:1px dashed var(--border-strong); border-radius:var(--r-md); padding:1rem; margin-top:1rem; }
.similar-solve-btn {
  padding:6px 12px; font-size:0.78rem; cursor:pointer; min-height:32px; border-radius:var(--r-sm);
  border:1px solid var(--border-strong); background:var(--glass-input-bg); -webkit-backdrop-filter:blur(8px) saturate(1.3); backdrop-filter:blur(8px) saturate(1.3); color:var(--text-primary);
  font-family:var(--font-body); font-weight:600; transition:all 0.15s ease;
}
.similar-solve-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
.similar-reveal summary { cursor:pointer; font-size:0.82rem; color:var(--text-secondary); }
.similar-reveal summary:hover { color:var(--text-primary); }
</style>

<div class="math-grid">
  <div class="math-card ipd-anim ipd-d1">
    <div class="math-card-head">
      <label class="math-card-label" for="mProblem">Problem</label>
      <select id="mLevel" class="math-level-select" aria-label="Difficulty level">
        <option value="middle_school">Middle school</option>
        <option value="high_school" selected>High school</option>
        <option value="undergrad">Undergrad</option>
      </select>
    </div>
    <textarea id="mProblem" class="math-textarea" placeholder="e.g. Solve 2x^2 + 5x - 3 = 0" aria-label="Math problem"></textarea>
    <button class="math-submit" onclick="ipMathExplain()" id="mBtn" type="button">Explain step by step</button>
  </div>

  <div class="math-card ipd-anim ipd-d2">
    <div class="math-card-label" style="margin-bottom:12px;">Solution</div>
    <div id="mResult">
      <div class="ipd-empty-solution">Enter a problem and click <strong>Explain step by step</strong>.</div>
    </div>
  </div>
</div>

<script>
let ipMathLast = null;

function ipMathEsc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function ipMathSkeleton() {
  return '<div class="math-skeleton" role="status" aria-label="Solving problem">' +
    '<div class="math-skel-row short"></div><div class="math-skel-row"></div><div class="math-skel-row"></div>' +
    '</div>';
}

function ipMathExplain() {
  const problem = document.getElementById('mProblem').value.trim();
  if (!problem) return;
  const btn = document.getElementById('mBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="ipd-pulse-dot"></span>Solving…';
  document.getElementById('mResult').innerHTML = ipMathSkeleton();
  fetch('/api/math/explain', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ problem, level: document.getElementById('mLevel').value }),
  }).then(r => r.json()).then(d => {
    btn.disabled = false; btn.textContent = 'Explain step by step';
    if (d.status !== 'ok') {
      document.getElementById('mResult').innerHTML = '<div class="ipd-error-box">Couldn’t solve that problem. ' + ipMathEsc(d.message || 'Try rephrasing it and try again.') + '<br><button onclick="ipMathExplain()" type="button">Retry</button></div>';
      return;
    }
    ipMathLast = d;
    ipMathRender();
  }).catch(() => {
    btn.disabled = false; btn.textContent = 'Explain step by step';
    document.getElementById('mResult').innerHTML = '<div class="ipd-error-box">Couldn’t reach the server. Check your connection and try again.<br><button onclick="ipMathExplain()" type="button">Retry</button></div>';
  });
}

function ipMathRender() {
  const d = ipMathLast;
  const steps = d.steps || [];
  let html = '';
  steps.forEach(s => {
    html += `
      <div class="step-row">
        <div class="step-num">${ipMathEsc(s.step ?? '')}</div>
        <div class="step-body">
          <div class="step-text">${ipMathEsc(s.explanation || '')}</div>
          ${s.math ? `<div class="step-math">${ipMathEsc(s.math)}</div>` : ''}
        </div>
      </div>`;
  });
  html += `
    <div class="answer-card">
      <div class="answer-label">Answer</div>
      <div class="answer-value">${ipMathEsc(d.answer || '-')}</div>
    </div>`;
  if (d.notes) html += `<div class="notes-box"><strong>Tips:</strong> ${ipMathEsc(d.notes)}</div>`;
  html += `<button class="math-submit" onclick="ipMathSimilar()" id="mSimBtn" type="button" style="margin-top:1rem;background:var(--glass-bg); -webkit-backdrop-filter:blur(16px) saturate(1.6); backdrop-filter:blur(16px) saturate(1.6);color:var(--text-primary);border:1px solid var(--border-strong);">Try a similar problem</button>`;
  html += `<div id="mSim"></div>`;
  document.getElementById('mResult').innerHTML = html;
}

function ipMathSimilar() {
  const problem = (ipMathLast && ipMathLast.problem) || document.getElementById('mProblem').value.trim();
  if (!problem) return;
  const btn = document.getElementById('mSimBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="ipd-pulse-dot"></span>Generating…';
  fetch('/api/math/similar', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ problem }),
  }).then(r => r.json()).then(d => {
    btn.disabled = false; btn.textContent = 'Try a similar problem';
    if (d.status !== 'ok') {
      document.getElementById('mSim').innerHTML = '<div class="ipd-error-box" style="margin-top:0.8rem;">Couldn’t generate a similar problem. <button onclick="ipMathSimilar()" type="button">Retry</button></div>';
      return;
    }
    document.getElementById('mSim').innerHTML = `
      <div class="similar-card">
        <div class="math-card-label" style="margin-bottom:6px;">Try this</div>
        <div style="font-family:var(--font-mono);font-size:0.95rem;margin-bottom:8px;">${ipMathEsc(d.problem || '')}</div>
        <details class="similar-reveal"><summary>Reveal answer</summary><div style="margin-top:6px;font-family:var(--font-mono);font-size:0.92rem;color:var(--low);font-variant-numeric:tabular-nums;">${ipMathEsc(d.answer || '')}</div></details>
        <div style="margin-top:8px;"><button class="similar-solve-btn" onclick="ipMathLoadSimilar(${JSON.stringify(d.problem||'').replace(/"/g,'&quot;')})" type="button">Solve this</button></div>
      </div>`;
  }).catch(() => {
    btn.disabled = false; btn.textContent = 'Try a similar problem';
    document.getElementById('mSim').innerHTML = '<div class="ipd-error-box" style="margin-top:0.8rem;">Couldn’t reach the server. <button onclick="ipMathSimilar()" type="button">Retry</button></div>';
  });
}

function ipMathLoadSimilar(p) {
  document.getElementById('mProblem').value = p;
  ipMathExplain();
}
</script>
{% endblock %}
