{% extends "base.html" %}
{% block content %}
<div class="login-wrap">
  <div class="login-card" style="max-width:480px;">
    <div class="login-header">
      <div style="margin-bottom:0.75rem;color:var(--accent);"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-link"/></svg></div>
      <h1 class="login-title">Connect your school</h1>
      <p class="login-subtitle">Link your LMS so IntelliPlan can pull your assignments</p>
    </div>
    <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:1.5rem;">
      <a href="/oauth/canvas" style="display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:14px;border:1px solid var(--border);background:var(--bg-card);text-decoration:none;color:var(--text-primary);box-shadow:var(--shadow);transition:all 0.2s;"
        onmouseover="this.style.borderColor='#e66000'" onmouseout="this.style.borderColor='var(--border)'">
        <div style="width:42px;height:42px;border-radius:10px;background:#e66000;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:white;font-weight:800;font-size:1rem;font-family:'DM Sans',sans-serif;">C</div>
        <div>
          <div style="font-size:0.95rem;font-weight:600;margin-bottom:2px;">Canvas LMS</div>
          <div style="font-size:0.78rem;color:var(--text-muted);">One-click OAuth, no token needed</div>
        </div>
        <div style="margin-left:auto;color:var(--text-muted);">→</div>
      </a>
      <a href="/login/studentvue" style="display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:14px;border:1px solid var(--border);background:var(--bg-card);text-decoration:none;color:var(--text-primary);box-shadow:var(--shadow);transition:all 0.2s;"
        onmouseover="this.style.borderColor='#22c55e'" onmouseout="this.style.borderColor='var(--border)'">
        <div style="width:42px;height:42px;border-radius:10px;background:#16a34a;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:white;font-weight:800;font-size:1rem;font-family:'DM Sans',sans-serif;">S</div>
        <div>
          <div style="font-size:0.95rem;font-weight:600;margin-bottom:2px;">StudentVue</div>
          <div style="font-size:0.78rem;color:var(--text-muted);">Connect with district credentials</div>
        </div>
        <div style="margin-left:auto;color:var(--text-muted);">→</div>
      </a>
      <a href="/login/schoology" style="display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:14px;border:1px solid var(--border);background:var(--bg-card);text-decoration:none;color:var(--text-primary);box-shadow:var(--shadow);transition:all 0.2s;"
        onmouseover="this.style.borderColor='#5865F2'" onmouseout="this.style.borderColor='var(--border)'">
        <div style="width:42px;height:42px;border-radius:10px;background:#5865F2;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:white;font-weight:800;font-size:1rem;font-family:'DM Sans',sans-serif;">S</div>
        <div>
          <div style="font-size:0.95rem;font-weight:600;margin-bottom:2px;">Schoology</div>
          <div style="font-size:0.78rem;color:var(--text-muted);">API key required · <span style="color:var(--high);font-weight:600;">not recommended</span></div>
        </div>
        <div style="margin-left:auto;color:var(--text-muted);">→</div>
      </a>
      <button onclick="connectLms('google_classroom')" style="display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:14px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);box-shadow:var(--shadow);transition:all 0.2s;cursor:pointer;width:100%;text-align:left;font-family:inherit;"
        onmouseover="this.style.borderColor='#0F9D58'" onmouseout="this.style.borderColor='var(--border)'">
        <div style="width:42px;height:42px;border-radius:10px;background:#0F9D58;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:white;font-weight:800;font-size:1rem;font-family:var(--font-ui);">G</div>
        <div>
          <div style="font-size:0.95rem;font-weight:600;margin-bottom:2px;">Google Classroom</div>
          <div style="font-size:0.78rem;color:var(--text-muted);">K-12 standard, sign in with your Google account</div>
        </div>
        <div style="margin-left:auto;color:var(--text-muted);">→</div>
      </button>
      <button onclick="connectBlackboard()" style="display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:14px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);box-shadow:var(--shadow);transition:all 0.2s;cursor:pointer;width:100%;text-align:left;font-family:inherit;"
        onmouseover="this.style.borderColor='#000000'" onmouseout="this.style.borderColor='var(--border)'">
        <div style="width:42px;height:42px;border-radius:10px;background:#000000;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:white;font-weight:800;font-size:1rem;font-family:var(--font-ui);">B</div>
        <div>
          <div style="font-size:0.95rem;font-weight:600;margin-bottom:2px;">Blackboard Learn</div>
          <div style="font-size:0.78rem;color:var(--text-muted);">North American higher ed, sign in with your school's Blackboard</div>
        </div>
        <div style="margin-left:auto;color:var(--text-muted);">→</div>
      </button>
      <button onclick="connectLms('brightspace')" style="display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:14px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);box-shadow:var(--shadow);transition:all 0.2s;cursor:pointer;width:100%;text-align:left;font-family:inherit;"
        onmouseover="this.style.borderColor='#FF6F00'" onmouseout="this.style.borderColor='var(--border)'">
        <div style="width:42px;height:42px;border-radius:10px;background:#FF6F00;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:white;font-weight:800;font-size:1rem;font-family:var(--font-ui);">D</div>
        <div>
          <div style="font-size:0.95rem;font-weight:600;margin-bottom:2px;">D2L Brightspace</div>
          <div style="font-size:0.78rem;color:var(--text-muted);">Universities &amp; K-12, join the rollout waitlist</div>
        </div>
        <div style="margin-left:auto;color:var(--text-muted);">→</div>
      </button>
      <button onclick="connectLms('moodle')" style="display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:14px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);box-shadow:var(--shadow);transition:all 0.2s;cursor:pointer;width:100%;text-align:left;font-family:inherit;"
        onmouseover="this.style.borderColor='#F98012'" onmouseout="this.style.borderColor='var(--border)'">
        <div style="width:42px;height:42px;border-radius:10px;background:#F98012;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:white;font-weight:800;font-size:1rem;font-family:var(--font-ui);">M</div>
        <div>
          <div style="font-size:0.95rem;font-weight:600;margin-bottom:2px;">Moodle</div>
          <div style="font-size:0.78rem;color:var(--text-muted);">Open-source LMS used worldwide, connect with URL + token</div>
        </div>
        <div style="margin-left:auto;color:var(--text-muted);">→</div>
      </button>
    </div>
    <div id="lmsInlineForms" style="display:flex;flex-direction:column;gap:12px;margin-bottom:1rem;"></div>
    <script>
      function lmsBanner(text) {
        const banner = document.createElement('div');
        banner.textContent = text;
        banner.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0d0d0d;color:#fff;padding:11px 22px;border-radius:10px;font-size:0.84rem;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.25);max-width:90%;';
        document.body.appendChild(banner);
        setTimeout(() => banner.remove(), 3500);
      }
      async function connectLms(provider, body) {
        try {
          const opts = { method: 'POST' };
          if (body) { opts.headers = {'Content-Type': 'application/json'}; opts.body = JSON.stringify(body); }
          const res = await fetch('/api/lms/connect/' + provider, opts);
          const data = await res.json();
          if (data.status === 'ok' && data.url) { window.location.href = data.url; }
          else if (data.status === 'pending') { lmsBanner('✓ ' + data.message); }
          else if (data.status === 'manual' && provider === 'moodle') { showMoodleForm(); }
          else if (data.status === 'need_institution' && provider === 'blackboard') { showBlackboardForm(); }
          else { alert(data.message || 'Could not start connection.'); }
        } catch (e) { alert('Network error, please try again.'); }
      }
      function formHost() {
        return document.getElementById('lmsInlineForms') || document.querySelector('.login-card');
      }
      async function connectBlackboard() { showBlackboardForm(); }
      function showBlackboardForm() {
        if (document.getElementById('blackboardForm')) { document.getElementById('blackboardForm').scrollIntoView({behavior:'smooth'}); return; }
        const wrap = document.createElement('div');
        wrap.id = 'blackboardForm';
        wrap.style.cssText = 'padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--bg-card);';
        wrap.innerHTML = `
          <div style="font-weight:600;margin-bottom:8px;font-size:0.95rem;">Connect Blackboard Learn</div>
          <p style="font-size:0.78rem;color:var(--text-muted);line-height:1.5;margin:0 0 12px;">
            Paste your school's Blackboard Learn URL. IntelliPlan will send you to that institution's OAuth sign-in page.
          </p>
          <label style="display:block;font-size:0.78rem;font-weight:600;margin-bottom:4px;" for="bbUrl">Blackboard URL</label>
          <input id="bbUrl" type="url" placeholder="https://learn.myschool.edu" autocomplete="off"
            style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-secondary);color:var(--text-primary);font-family:inherit;font-size:0.9rem;margin-bottom:12px;"/>
          <button type="button" id="bbBtn" onclick="submitBlackboard()"
            style="width:100%;padding:11px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-weight:700;cursor:pointer;font-size:0.9rem;">Continue to Blackboard</button>
          <div id="bbMsg" style="margin-top:8px;font-size:0.8rem;display:none;"></div>
        `;
        formHost().appendChild(wrap);
        wrap.scrollIntoView({behavior:'smooth'});
      }
      async function submitBlackboard() {
        const url = (document.getElementById('bbUrl').value || '').trim();
        const msg = document.getElementById('bbMsg');
        const btn = document.getElementById('bbBtn');
        if (!url) { msg.style.display='block'; msg.style.color='#ef4444'; msg.textContent='Paste your Blackboard URL first.'; return; }
        btn.disabled = true; btn.textContent = 'Starting...';
        try {
          const r = await fetch('/api/lms/connect/blackboard', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ institution_url: url })
          });
          const d = await r.json();
          if (d.status === 'ok' && d.url) {
            window.location.href = d.url;
          } else {
            msg.style.display='block'; msg.style.color='#ef4444';
            msg.textContent = d.message || 'Could not start Blackboard sign-in.';
            btn.disabled = false; btn.textContent = 'Continue to Blackboard';
          }
        } catch (e) {
          msg.style.display='block'; msg.style.color='#ef4444';
          msg.textContent = 'Network error, please try again.';
          btn.disabled = false; btn.textContent = 'Continue to Blackboard';
        }
      }
      function showMoodleForm() {
        if (document.getElementById('moodleForm')) { document.getElementById('moodleForm').scrollIntoView({behavior:'smooth'}); return; }
        const wrap = document.createElement('div');
        wrap.id = 'moodleForm';
        wrap.style.cssText = 'padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--bg-card);';
        wrap.innerHTML = `
          <div style="font-weight:600;margin-bottom:8px;font-size:0.95rem;">Connect Moodle</div>
          <p style="font-size:0.78rem;color:var(--text-muted);line-height:1.5;margin:0 0 12px;">
            In your Moodle profile → <em>Preferences</em> → <em>Security keys</em>, copy the token for the Moodle mobile web service. Then paste your Moodle URL and the token below.
          </p>
          <label style="display:block;font-size:0.78rem;font-weight:600;margin-bottom:4px;" for="mUrl">Moodle URL</label>
          <input id="mUrl" type="url" placeholder="https://moodle.myschool.edu" autocomplete="off"
            style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-secondary);color:var(--text-primary);font-family:inherit;font-size:0.9rem;margin-bottom:10px;"/>
          <label style="display:block;font-size:0.78rem;font-weight:600;margin-bottom:4px;" for="mTok">Web-services token</label>
          <input id="mTok" type="password" placeholder="Your Moodle web-services token" autocomplete="off"
            style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-secondary);color:var(--text-primary);font-family:inherit;font-size:0.9rem;margin-bottom:12px;"/>
          <button type="button" id="mBtn" onclick="submitMoodle()"
            style="width:100%;padding:11px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-weight:700;cursor:pointer;font-size:0.9rem;">Connect Moodle</button>
          <div id="mMsg" style="margin-top:8px;font-size:0.8rem;display:none;"></div>
        `;
        formHost().appendChild(wrap);
        wrap.scrollIntoView({behavior:'smooth'});
      }
      async function submitMoodle() {
        const url = (document.getElementById('mUrl').value || '').trim();
        const tok = (document.getElementById('mTok').value || '').trim();
        const msg = document.getElementById('mMsg');
        const btn = document.getElementById('mBtn');
        if (!url || !tok) { msg.style.display='block'; msg.style.color='#ef4444'; msg.textContent='Both fields are required.'; return; }
        btn.disabled = true; btn.textContent = 'Verifying...';
        try {
          const r = await fetch('/api/lms/connect/moodle/manual', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ moodle_url: url, ws_token: tok })
          });
          const d = await r.json();
          if (d.status === 'ok') {
            msg.style.display='block'; msg.style.color='#10b981';
            msg.textContent = 'Connected as ' + (d.fullname || d.username || 'your Moodle account') + '.';
            setTimeout(() => { window.location.href = '/schedule'; }, 900);
          } else {
            msg.style.display='block'; msg.style.color='#ef4444';
            msg.textContent = d.message || 'Could not connect.';
            btn.disabled = false; btn.textContent = 'Connect Moodle';
          }
        } catch (e) {
          msg.style.display='block'; msg.style.color='#ef4444';
          msg.textContent = 'Network error, please try again.';
          btn.disabled = false; btn.textContent = 'Connect Moodle';
        }
      }
    </script>
    <div style="text-align:center;">
      <a href="/schedule" style="font-size:0.82rem;color:var(--text-muted);text-decoration:none;">Skip for now →</a>
    </div>
  </div>
</div>
{% endblock %}
