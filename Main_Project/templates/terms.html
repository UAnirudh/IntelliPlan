<!DOCTYPE html>
<!--
  DEPRECATED, kept only so old links don't 404 if some external
  reference still loads this template name directly. The canonical
  Privacy Policy + Terms of Service live in legal.html and are
  served at /legal (anchored at #privacy and #terms). The /privacy
  and /terms URL paths are 301-redirected in App.py.

  This file previously carried a full second copy of the Terms with its
  own Arial stylesheet and a stale effective date, which meant two
  divergent versions of the same legal text could be served. Reduced to
  the same redirect stub privacy.html already uses.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0;url=/legal#terms">
  <link rel="canonical" href="https://intelliplan.tech/legal#terms">
  <title>Terms of Service → /legal</title>
</head>
<body>
  <p>The Terms of Service have moved to <a href="/legal#terms">/legal#terms</a>.</p>
</body>
</html>
