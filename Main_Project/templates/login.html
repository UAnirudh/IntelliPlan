{% extends "base.html" %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">
        <img src="/static/icons/icon-192.png" alt="Logo">
      </div>
      <h1 class="login-title">Sign in to IntelliPlan</h1>
      <p class="login-subtitle">Choose how you want to get started</p>
    </div>

    <!-- Google Sign In -->
    <a href="/login/google" class="btn-google" aria-label="Sign in with Google" onclick="handleGoogleLogin(event)">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Sign in with Google
    </a>

    <div class="divider"><span>or use email</span></div>

    <!-- Account options -->
    <div class="account-buttons">
      <a href="/register" class="btn-primary">Create Account</a>
      <a href="/login/account" class="btn-secondary">Sign In</a>
    </div>

    <div class="divider"><span>or continue as guest</span></div>

    <!-- Guest options, real <button> elements, not links, so they match Create Account / Sign In -->
    <div class="guest-options">
      <button type="button" class="btn-guest canvas" onclick="window.location.href='/login/canvas'">
        <img src="/static/logos/canvas.svg" alt="Canvas LMS" width="32" height="32" style="width:32px;height:32px;border-radius:8px;flex-shrink:0;object-fit:cover;">
        <span class="text">
          <span class="title">Canvas LMS</span>
          <span class="subtitle">Guest, connect with access token</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </button>

      <button type="button" class="btn-guest studentvue" onclick="window.location.href='/login/studentvue'">
        <img src="/static/logos/studentvue.svg" alt="StudentVue" width="32" height="32" style="width:32px;height:32px;border-radius:8px;flex-shrink:0;object-fit:cover;">
        <span class="text">
          <span class="title">StudentVue</span>
          <span class="subtitle">Guest, connect with district credentials</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </button>

      <button type="button" class="btn-guest schoology" onclick="window.location.href='/login/schoology'">
        <img src="/static/logos/schoology.svg" alt="Schoology" width="32" height="32" style="width:32px;height:32px;border-radius:8px;flex-shrink:0;object-fit:cover;">
        <span class="text">
          <span class="title">Schoology</span>
          <span class="subtitle">API key required · <span class="highlight">not recommended</span></span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </button>

      <button type="button" class="btn-guest" onclick="window.location.href='/connect'" style="border-color:color-mix(in srgb, var(--accent) 25%, var(--border));">
        <img src="/static/logos/google-classroom.svg" alt="More school platforms" width="32" height="32" style="width:32px;height:32px;border-radius:8px;flex-shrink:0;object-fit:cover;">
        <span class="text">
          <span class="title">More school platforms</span>
          <span class="subtitle">Google Classroom, Blackboard, Moodle &amp; more</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </button>
    </div>

    <div class="login-footer">
      Creating an account saves your data across devices.<br>
      Guest mode resets when your session expires.
    </div>
  </div>
</div>
<script>
function handleGoogleLogin(e) {
  const params = new URLSearchParams(window.location.search);
  const returnTo = params.get('return_to') || '';
  let url = '/login/google';
  if (returnTo) url += '?return_to=' + encodeURIComponent(returnTo);
  // Google's OAuth page refuses to load inside an iframe (403).
  // If we're embedded, break out to the top window so the flow works.
  if (window !== window.top) {
    e.preventDefault();
    window.top.location.href = url;
  } else if (returnTo) {
    e.preventDefault();
    window.location.href = url;
  }
}
</script>
{% endblock %}
